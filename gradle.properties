#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
kotlin.apple.xcodeCompatibility.nowarn=true

# Tests on a device (Macrobenchmark, baseline profile) must not uninstall the app afterwards: the phone is a real one,
# with its owner's library in it.
android.injected.androidTest.leaveApksInstalledAfterRun=true

# The CocoaPods plugin is in maintenance mode; moving the iOS app to Swift Package Manager is item 25.15 of the roadmap,
# with the SwiftUI rewrite of phase 25. Until then its reminder would hide new warnings.
kotlin.native.cocoapods.swiftpmMigration.nowarn=true
