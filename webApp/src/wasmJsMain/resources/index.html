<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast KMP</title>
    <meta name="theme-color" content="#F2A93B">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<div id="compose-receiver" style="height: 100%"></div>
<script>
    // The language chosen in the app's Settings (18.5) answers for the browser's, which Compose reads.
    const browserLanguages = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
    Object.defineProperty(Navigator.prototype, "languages", {
        ...browserLanguages,
        get: function () { return window.__customLocale ? [window.__customLocale] : browserLanguages.get.apply(this); },
    });
</script>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
