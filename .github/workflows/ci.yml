name: CI

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8192M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    static-analysis:
        name: Static Analysis
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create google-services.json
              uses: ./.github/actions/secret-file
              with:
                  content: ${{ secrets.GOOGLE_SERVICES_JSON }}
                  path: androidApp/google-services.json
                  placeholder: .github/ci/google-services.json

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Detekt and Android lint
              run: ./gradlew :shared:detekt :core:designsystem:detekt :androidApp:lintDebug

            - name: Upload reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: static-analysis-reports
                  path: |
                      **/build/reports/detekt/
                      androidApp/build/reports/lint-results-debug.*

    test-jvm:
        name: Run JVM Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create google-services.json
              uses: ./.github/actions/secret-file
              with:
                  content: ${{ secrets.GOOGLE_SERVICES_JSON }}
                  path: androidApp/google-services.json
                  placeholder: .github/ci/google-services.json

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Run tests
              run: ./gradlew :shared:testAndroidHostTest :shared:desktopTest :core:designsystem:desktopTest

            - name: Verify design system snapshots
              if: hashFiles('core/designsystem/snapshots/*.png') != ''
              run: ./gradlew :core:designsystem:verifyRoborazziAndroidHostTest

            - name: Upload snapshot diffs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: snapshot-diffs
                  path: core/designsystem/build/outputs/roborazzi/

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports-jvm
                  path: "**/build/reports/tests/"

    test-ios:
        name: Run iOS Tests
        runs-on: macos-15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # The image's default Xcode is the one with its simulator runtime installed; pinning an older
            # Xcode failed with "iOS 18.2 is not installed".
            - name: Show Xcode
              run: xcodebuild -version && xcrun simctl list runtimes

            - name: Create GoogleService-Info.plist
              uses: ./.github/actions/secret-file
              with:
                  content: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
                  path: iosApp/iosApp/GoogleService-Info.plist
                  placeholder: .github/ci/GoogleService-Info.plist

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Cache Kotlin/Native
              uses: actions/cache@v4
              with:
                  path: ~/.konan
                  key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

            - name: Run tests
              run: ./gradlew :shared:iosSimulatorArm64Test 2>&1 | tee ios-test.log

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports-ios
                  path: "**/build/reports/tests/"

            - name: Upload full build log on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: ios-test-full-log
                  path: ios-test.log

    build-android:
        name: Build Android
        runs-on: ubuntu-latest
        needs: [ static-analysis, test-jvm ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create google-services.json
              uses: ./.github/actions/secret-file
              with:
                  content: ${{ secrets.GOOGLE_SERVICES_JSON }}
                  path: androidApp/google-services.json
                  placeholder: .github/ci/google-services.json

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Build Android debug APK
              run: ./gradlew :androidApp:assembleDebug

            - name: Upload Android debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: android-apk
                  path: androidApp/build/outputs/apk/debug/*.apk

            - name: Upload Android build reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: android-build-reports
                  path: "**/build/reports/"

    build-ios:
        name: Build iOS
        runs-on: macos-15
        needs: [ test-ios ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # The image's default Xcode is the one with its simulator runtime installed; pinning an older
            # Xcode failed with "iOS 18.2 is not installed".
            - name: Show Xcode
              run: xcodebuild -version && xcrun simctl list runtimes

            - name: Create GoogleService-Info.plist
              uses: ./.github/actions/secret-file
              with:
                  content: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
                  path: iosApp/iosApp/GoogleService-Info.plist
                  placeholder: .github/ci/GoogleService-Info.plist

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Cache Kotlin/Native
              uses: actions/cache@v4
              with:
                  path: ~/.konan
                  key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

            # The app links the shared framework and Firebase through CocoaPods, so the pods must exist
            # and the build must use the workspace, not the bare project. ARCHS=arm64: Kotlin only builds
            # iosSimulatorArm64, so the generic simulator destination must not ask for x86_64.
            - name: Install pods
              run: |
                  ./gradlew :shared:generateDummyFramework
                  cd iosApp && pod install

            - name: Build iOS simulator app
              run: |
                  xcodebuild build \
                    -workspace iosApp/iosApp.xcworkspace \
                    -scheme iosApp \
                    -configuration Debug \
                    -sdk iphonesimulator \
                    -destination 'generic/platform=iOS Simulator' \
                    -derivedDataPath ./build \
                    ARCHS=arm64 \
                    CODE_SIGNING_ALLOWED=NO

            - name: Upload app folder
              uses: actions/upload-artifact@v4
              with:
                  name: iphonesimulator-app
                  path: build/Build/Products/Debug-iphonesimulator/*.app

    build-web:
        name: Build Web
        runs-on: ubuntu-latest
        needs: [ test-jvm ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Build Web
              run: ./gradlew :webApp:wasmJsBrowserDistribution

            - name: Upload Web artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: web-dist
                  path: webApp/build/dist/wasmJs/productionExecutable/

            - name: Upload Web build reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: web-build-reports
                  path: "**/build/reports/"

    build-desktop:
        name: Build Desktop (${{ matrix.os }})
        needs: [ test-jvm ]
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, macos-15, windows-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            # Each OS packages its own installer: JavaFX ships per-OS jars picked at build time.
            - name: Package Desktop
              shell: bash
              run: ./gradlew :desktopApp:packageDistributionForCurrentOS

            - name: Upload Desktop artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-dist-${{ matrix.os }}
                  path: desktopApp/build/compose/binaries/main/

            - name: Upload Desktop build reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-build-reports-${{ matrix.os }}
                  path: "**/build/reports/"
