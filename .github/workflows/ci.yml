name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: ./.github/actions/gradle-setup

      - name: Run Android and Desktop tests (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :shared:testAndroidHostTest :shared:desktopTest

      - name: Run iOS tests (macOS)
        if: matrix.os == 'macos-latest'
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build Web (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :webApp:build
