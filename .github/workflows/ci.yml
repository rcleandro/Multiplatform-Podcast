name: CI

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

env:
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    test-jvm:
        name: Run JVM Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create google-services.json
              if: env.GOOGLE_SERVICES_JSON != ''
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Run tests
              run: ./gradlew :shared:testAndroidHostTest :shared:desktopTest --stacktrace --info

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports-jvm
                  path: "**/build/reports/tests/"

    test-ios:
        name: Run iOS Tests
        runs-on: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create GoogleService-Info.plist
              if: env.GOOGLE_SERVICE_INFO_PLIST != ''
              env:
                  GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
              run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > iosApp/iosApp/GoogleService-Info.plist

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Run tests
              run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace --info

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports-ios
                  path: "**/build/reports/tests/"

    build-android:
        name: Build Android
        runs-on: ubuntu-latest
        needs: [ test-jvm, test-ios ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create google-services.json
              if: env.GOOGLE_SERVICES_JSON != ''
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Build Android debug APK
              run: ./gradlew :androidApp:assembleDebug

            - name: Upload Android debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: android-apk
                  path: androidApp/build/outputs/apk/debug/*.apk

            - name: Upload Android build reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: android-build-reports
                  path: "**/build/reports/"

    build-ios:
        name: Build iOS
        runs-on: macos-latest
        needs: [ test-jvm, test-ios ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create GoogleService-Info.plist
              if: env.GOOGLE_SERVICE_INFO_PLIST != ''
              env:
                  GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
              run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > iosApp/iosApp/GoogleService-Info.plist

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Verify Xcode project exists
              run: test -d iosApp/iosApp.xcodeproj

            - name: Build iOS simulator app
              run: |
                  xcodebuild build \
                    -project iosApp/iosApp.xcodeproj \
                    -configuration Debug \
                    -scheme iosApp \
                    -sdk iphonesimulator \
                    -derivedDataPath ./build \
                    -verbose

            - name: Upload app folder
              uses: actions/upload-artifact@v4
              with:
                  name: iphonesimulator-app
                  path: build/Build/Products/Debug-iphonesimulator/*.app

    build-web:
        name: Build Web
        runs-on: ubuntu-latest
        needs: [ test-jvm, test-ios ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Build Web
              run: ./gradlew :webApp:wasmJsBrowserDistribution

            - name: Upload Web artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: web-dist
                  path: webApp/build/dist/wasmJs/productionExecutable/

            - name: Upload Web build reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: web-build-reports
                  path: "**/build/reports/"

    build-desktop:
        name: Build Desktop
        runs-on: ubuntu-latest
        needs: [ test-jvm, test-ios ]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create google-services.json
              if: env.GOOGLE_SERVICES_JSON != ''
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Build Desktop
              run: ./gradlew :desktopApp:packageDistributionForCurrentOS

            - name: Upload Desktop artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-dist
                  path: desktopApp/build/compose/binaries/main/

            - name: Upload Desktop build reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-build-reports
                  path: "**/build/reports/"
