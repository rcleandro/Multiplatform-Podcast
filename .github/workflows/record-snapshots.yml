name: Record snapshots

# Records the design system reference images on Linux and commits them to the chosen branch.
# Images must come from this workflow: Robolectric renders differently on macOS, so Mac images never match CI.
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    record:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Record snapshots
              run: ./gradlew :core:designsystem:recordRoborazziAndroidHostTest

            - name: Commit images
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add core/designsystem/snapshots
                  git diff --cached --quiet || git commit -m "test(designsystem): record snapshots"
                  git push
