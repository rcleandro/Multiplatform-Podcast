name: Release

# 20.6: pushing a tag vX.Y.Z builds every installer and publishes a GitHub Release with notes from the commits.
# Bump version.properties first; the tag must name the same version.
# The macOS app is signed once a Developer ID is in the secrets (20.5); iOS goes to TestFlight once the App Store Connect
# key is (25.15b), and is only archived without signing before that.
on:
    push:
        tags: [ 'v*.*.*' ]

# Read-only by default (22.10, CodeQL actions/missing-workflow-permissions); a job that writes asks for it itself.
permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}

env:
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8192M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
    version:
        name: Check the version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Tag matches version.properties
              run: |
                  version=$(sed -n 's/^APP_VERSION=//p' version.properties)
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION=$version in version.properties."
                      exit 1
                  fi

    android:
        name: Android
        needs: version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Create google-services.json
              uses: ./.github/actions/secret-file
              with:
                  content: ${{ secrets.GOOGLE_SERVICES_JSON }}
                  path: androidApp/google-services.json
                  placeholder: .github/ci/google-services.json

            # The placeholder is fine for CI, not for users: their crashes would go nowhere.
            - name: Refuse the placeholder Firebase config
              run: |
                  if cmp -s androidApp/google-services.json .github/ci/google-services.json; then
                      echo "::error::GOOGLE_SERVICES_JSON is missing or invalid; a release needs the real file."
                      exit 1
                  fi

            - name: Release keystore
              env:
                  KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  if [ -z "$KEYSTORE" ]; then
                      echo "::warning::ANDROID_KEYSTORE_BASE64 is empty; the APKs and bundles come out unsigned."
                      exit 0
                  fi
                  printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
                  echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Build APKs and App Bundles (phone and watch)
              env:
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease :wearApp:assembleRelease :wearApp:bundleRelease

            - name: Collect
              run: |
                  mkdir dist
                  cp androidApp/build/outputs/apk/release/*.apk "dist/podcast-$GITHUB_REF_NAME-phone.apk"
                  cp androidApp/build/outputs/bundle/release/*.aab "dist/podcast-$GITHUB_REF_NAME-phone.aab"
                  cp wearApp/build/outputs/apk/release/*.apk "dist/podcast-$GITHUB_REF_NAME-watch.apk"
                  cp wearApp/build/outputs/bundle/release/*.aab "dist/podcast-$GITHUB_REF_NAME-watch.aab"

            - name: Upload
              uses: actions/upload-artifact@v7
              with:
                  name: release-android
                  path: dist/

    desktop:
        name: Desktop (${{ matrix.os }})
        needs: version
        strategy:
            matrix:
                os: [ ubuntu-latest, macos-15, windows-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Package
              shell: bash
              run: ./gradlew :desktopApp:packageDistributionForCurrentOS

            - name: Upload
              uses: actions/upload-artifact@v7
              with:
                  name: release-desktop-${{ matrix.os }}
                  path: |
                      desktopApp/build/compose/binaries/main/dmg/*.dmg
                      desktopApp/build/compose/binaries/main/msi/*.msi
                      desktopApp/build/compose/binaries/main/deb/*.deb

    web:
        name: Web
        needs: version
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            - name: Build
              run: ./gradlew :webApp:wasmJsBrowserDistribution

            # The host must send COOP and COEP, or the database is lost on every reload (ADR 0013).
            - name: Zip
              run: |
                  mkdir dist
                  (cd webApp/build/dist/wasmJs/productionExecutable && zip -qr "$GITHUB_WORKSPACE/dist/podcast-$GITHUB_REF_NAME-web.zip" .)

            - name: Upload
              uses: actions/upload-artifact@v7
              with:
                  name: release-web
                  path: dist/

    # 25.15b: Xcode signs by itself (-allowProvisioningUpdates) with an App Store Connect API key, which needs only the
    # key and the team, no certificate or profile in the secrets, and the export sends the build to TestFlight. Without
    # the key the app is still archived in Release, unsigned, so a release that does not build or link fails here.
    ios:
        name: iOS
        needs: version
        runs-on: macos-15
        env:
            ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
            ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
            TEAM: ${{ secrets.APPLE_TEAM_ID }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Select Xcode 26
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: '26'

            - name: Create GoogleService-Info.plist
              uses: ./.github/actions/secret-file
              with:
                  content: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
                  path: iosApp/iosApp/GoogleService-Info.plist
                  placeholder: .github/ci/GoogleService-Info.plist

            - name: App Store Connect key
              run: |
                  if [ -z "$ASC_KEY" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$TEAM" ]; then
                      echo "::warning::No App Store Connect key in the secrets; the iOS app is archived unsigned and not sent to TestFlight."
                      exit 0
                  fi
                  if cmp -s iosApp/iosApp/GoogleService-Info.plist .github/ci/GoogleService-Info.plist; then
                      echo "::error::GOOGLE_SERVICE_INFO_PLIST is missing or invalid; a TestFlight build needs the real file."
                      exit 1
                  fi
                  printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
                  echo "SIGNING=-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID" >> "$GITHUB_ENV"

            - name: Gradle setup
              uses: ./.github/actions/gradle-setup

            # TEAM_ID stays empty, so the bundle IDs are the store's (Config.xcconfig appends it only for local builds).
            - name: Archive
              run: |
                  if [ -n "$SIGNING" ]; then
                      sign=(DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic)
                  else
                      sign=(CODE_SIGNING_ALLOWED=NO)
                  fi
                  # shellcheck disable=SC2086 # SIGNING holds several flags
                  xcodebuild archive \
                    -project iosApp/iosApp.xcodeproj \
                    -scheme iosApp \
                    -configuration Release \
                    -destination 'generic/platform=iOS' \
                    -archivePath build/Podcast.xcarchive \
                    -clonedSourcePackagesDirPath ./spm \
                    $SIGNING "${sign[@]}"

            - name: Send to TestFlight
              if: env.SIGNING != ''
              run: |
                  cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0"><dict>
                      <key>method</key><string>app-store-connect</string>
                      <key>destination</key><string>upload</string>
                      <key>signingStyle</key><string>automatic</string>
                      <key>teamID</key><string>$TEAM</string>
                  </dict></plist>
                  PLIST
                  # shellcheck disable=SC2086 # SIGNING holds several flags
                  xcodebuild -exportArchive \
                    -archivePath build/Podcast.xcarchive \
                    -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                    -exportPath build/export \
                    $SIGNING

            # Crashlytics needs the symbols to name the frames of an iOS crash.
            - name: Upload dSYMs to Crashlytics
              if: env.SIGNING != ''
              run: |
                  spm/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols \
                    -gsp iosApp/iosApp/GoogleService-Info.plist -p ios build/Podcast.xcarchive/dSYMs

    publish:
        name: GitHub Release
        needs: [ android, desktop, web, ios ]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Download
              uses: actions/download-artifact@v8
              with:
                  pattern: release-*
                  path: dist
                  merge-multiple: true

            - name: Release notes
              run: .github/scripts/changelog.sh "$GITHUB_REF_NAME" > notes.md

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
